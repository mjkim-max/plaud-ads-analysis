name: gads-query

# Google Ads 임의 GAQL 조회 (읽기 전용) — 수동 실행 전용. 결과는 로그에 CSV로 출력.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "GAQL SELECT 쿼리"
        required: true
      customer_id:
        description: "조회할 고객 ID (하이픈 없이). 비우면 PLAUD 기본 계정"
        required: false
        default: ""
      login_customer_id:
        description: "MCC ID. 비우면 PLAUD MCC, '-' 넣으면 MCC 없이 직접 접근"
        required: false
        default: ""

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas

      - name: Run GAQL
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ inputs.login_customer_id || secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ inputs.customer_id || secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GADS_QUERY: ${{ inputs.query }}
        run: python -m collectors.gads_query
